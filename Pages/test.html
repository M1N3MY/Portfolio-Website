<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=1920px"> 
        <link rel="stylesheet" type="text/css" href="../test.css">
        <link rel="icon" type="image/png" href="images/favicon.png">
        <title>Sarah's Catalog</title>
    </head> 
        <style>
        body {
            background-color: #000000 !important;
        }

        .footer-text {
            color: #d179c1;
        }

        .content {
            gap: 10px;
            border: 2px solid #d179c1 !important;
            background-color: #1b1b1b !important;
        }

        .site-name, .top-nav-btn {
            color: #2a2236 !important;
        } 

        .top-nav-btn:hover {
            color: #d179c1 !important;
        }

        .sidebar-border, .content-border {
            background-image: url("../images/jellyfish.jpg") !important;
            border: 5px solid #1a1245 !important;
            background-size: cover;
            background-position: center;
        }
    </style>
    <body> 
        <!--  
            GRID: a 3 row grid with a varying amount of columns 
                ROW 1: header
                ROW 2: wrapper
                ROW 3: area underneath wrapper
                ( this also includes empty margin space)

            ROW 1 (row-1): contains the site header, top nav buttons
                row 1 column 1 (r1c1): (open space)
                row 1 column 2 (r1c2): site name + top nav buttons        
                row 1 column 3 (r1c3): (open space)     
        -->
        <div class="grid">
            <div class="row-1">
                <!-- ROW 1 COLUMN 1 -->
                <div class="r1-c1"></div>  

                <!--  ROW 1 COLUMN 2 -->
                <div class="r1-c2">
                    <!-- HEADER: site name + top nav buttons -->
                    <header>
                        <h1 class="site-name">Sarah's Catalog</h1>
                        <!-- TOP NAV BUTTONS -->
                        <nav class = top-nav-btns>
                            <a href="../home.html" class="button top-nav-btn">Home</a>
                            <a href="projects.html" class="button top-nav-btn">Projects</a>
                            <a href="links.html" class="button top-nav-btn">Links</a>
                        </nav>    
                    </header>
                </div> 
                
                <!-- ROW 1 COLUMN 3 -->
                <div class="r1-c3"></div> 
            </div> <!-- END OF ROW 1 -->


            <!-- 
                ROW 2 (row-2): contains the wrapper
                    row 2 column 1 (r2c1): (open space)
                    row 2 column 2 (r2c2): wrapper + main container        
                    row 2 column 3 (r2c3): (open space)
            -->
            <div class="row-2">
                <!-- ROW 2 COLUMN 1 -->
                <div class="r2-c1"></div> 

                <!-- ROW 2 COLUMN 2-->
                <div class="r2-c2">
                    <!-- MAIN CONTAINER: sidebars, main content (middle), footer --> 
                    <main>
                        <!-- MIDDLE: main content -->
                        <div class="middle">
                            <section class="world content">
                                <img src="../images/hubble-deep-space.jpg">
                            </section>
                            <section>

                            </section>
                        </div> <!-- END OF MIDDLE -->
                    </main> <!-- END OF MAIN CONTAINER -->
                </div> <!-- (end of row 2 column 2)-->

                <!-- ROW 2 COLUMN 3 -->
                <div class="r2-c3"></div> 
            </div><!-- END OF ROW 2 -->

            <!-- ROW 3: area underneath the wrapper -->
            <div class="row-3"></div> <!-- END OF ROW 3 -->
        </div> <!-- END OF GRID -->
    </body>
</html>
