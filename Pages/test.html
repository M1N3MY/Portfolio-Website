<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=1920px"> 
        <link rel="stylesheet" type="text/css" href="../test.css">
        <link rel="icon" type="image/png" href="images/favicon.png">
        <title>Sarah's Catalog</title>
    </head> 
        <style>
        body {
            background-color: #000000 !important;
        }

        .footer-text {
            color: #e08fce;
        }

        .content {
            gap: 10px;
            border: 2px solid #4b0fa7 !important;
            background-color: #1b1b1b !important;
        }

        .site-name, .top-nav-btn {
            color: #e08fce !important;
        } 

        .top-nav-btn:hover {
            color: #b4c405 !important;
        }
    </style>
    <body> 
        <!--  
            GRID: a 3 row grid with a varying amount of columns 
                ROW 1: header
                ROW 2: wrapper
                ROW 3: area underneath wrapper
                ( this also includes empty margin space)

            ROW 1 (row-1): contains the site header, top nav buttons
                row 1 column 1 (r1c1): (open space)
                row 1 column 2 (r1c2): site name + top nav buttons        
                row 1 column 3 (r1c3): (open space)     
        -->
        <div class="grid">
            <div class="row-1">
                <!-- ROW 1 COLUMN 1 -->
                <div class="r1-c1"></div>  

                <!--  ROW 1 COLUMN 2 -->
                <div class="r1-c2">
                    <!-- HEADER: site name + top nav buttons -->
                    <header>
                        <h1 class="site-name">Sarah's Catalog</h1>
                        <!-- TOP NAV BUTTONS -->
                        <nav class = top-nav-btns>
                            <a href="../home.html" class="button top-nav-btn">Home</a>
                            <a href="projects.html" class="button top-nav-btn">Projects</a>
                            <a href="credits.html" class="button top-nav-btn">Credits</a>
                            <a href="resources.html" class="button top-nav-btn">Resources</a>
                        </nav>    
                    </header>
                </div> 
                
                <!-- ROW 1 COLUMN 3 -->
                <div class="r1-c3"></div> 
            </div> <!-- END OF ROW 1 -->


            <!-- 
                ROW 2 (row-2): contains the wrapper
                    row 2 column 1 (r2c1): (open space)
                    row 2 column 2 (r2c2): wrapper + main container        
                    row 2 column 3 (r2c3): (open space)
            -->
            <div class="row-2">
                <!-- ROW 2 COLUMN 1 -->
                <div class="r2-c1"></div> 

                <!-- ROW 2 COLUMN 2-->
                <div class="r2-c2">
                    <!-- MAIN CONTAINER: sidebars, main content (middle), footer --> 
                    <main>
                        <!-- MIDDLE: main content -->
                        <div class="middle">
                            <section class="world content">
                                <img src="../images/world/000.png">
                            </section>
                            <section class="centered">
                                <!-- Image Map Generated by http://www.image-map.net/ -->
                                <img src="../images/arrows.PNG" usemap="#image-map" style="background-color: #e08fce;">
                                <map name="image-map">
                                    <area target="" alt="left" title="left" href="" coords="12,212,87,262,96,231,165,228,162,188,92,186,91,153" shape="poly">
                                    <area target="" alt="top" title="up" href="" coords="186,99,226,104,226,165,278,170,275,104,310,93,246,16,216,59" shape="poly">
                                    <area target="" alt="right" title="right" href="" coords="337,190,335,225,406,228,416,265,499,203,412,158,412,188" shape="poly">
                                    <area target="" alt="bottom" title="down" href="" coords="227,261,229,263,227,331,187,332,247,416,310,332,272,331,267,263,267,264,269,261,270,259,269,259,228,263,227,334" shape="poly">
                                </map>
                            </section>
                        </div> <!-- END OF MIDDLE -->
                    </main> <!-- END OF MAIN CONTAINER -->
                </div> <!-- (end of row 2 column 2)-->

                <!-- ROW 2 COLUMN 3 -->
                <div class="r2-c3"></div> 
            </div><!-- END OF ROW 2 -->

            <!-- ROW 3: area underneath the wrapper -->
            <div class="row-3"></div> <!-- END OF ROW 3 -->
        </div> <!-- END OF GRID -->
    </body>
</html>
