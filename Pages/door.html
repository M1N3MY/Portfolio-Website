<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=1640px"> 
        <link rel="stylesheet" type="text/css" href="../style.css">
        <link rel="icon" type="image/png" href="images/favicon.png">
        <title>Sarah's Catalog</title>
    </head>
    <style>
        body {
            background-color: #000000;
        }

        .content {
            padding: 2px;
            border-color: #160958;
            border-radius: 0px;
        }

        .middle {
            flex-direction: row;
        }

        .site-name, .top-nav-btn {
            color: #032c7d;
        }

        .top-nav-btn:hover {
            color: #feaf00;
        }
    </style> 
    <body> 
        <!-- header: title and top nav bar -->
        <header>
            <h1 class="site-name">Sarah's Catalog</h1>  
            <!-- top nav bar -->
            <nav class="top-nav-btns">
                <a href="../home.html" class="button top-nav-btn">Home</a>
                <a href="projects.html" class="button top-nav-btn">Projects</a>
                <a href="credits.html" class="button top-nav-btn">Credits</a>
                <a href="test.html" class="button top-nav-btn">Testing</a>
            </nav>  
        </header>


        <!-- main container: middle --> 
        <div class="main-container">
            <!-- middle: main content -->
            <main class="middle" style="width: 100%;">
                <!-- left window -->
                 <section class="content text centered flex-column" style="max-width: 150px; max-height: 235px;">
                    <img src="../images/flower-window.png">
                 </section>

                <!-- space door -->
                <section class="content text centered flex-column" style="max-width: 236px; max-height: 464px;">
                    <!-- Image Map Generated by http://www.image-map.net/ -->
                    <img src="../images/space-door.png" usemap="#space-door">
                    <map name="space-door">
                        <area target="" href="lobby.html" coords="233,463,2,2" shape="rect">
                    </map>
                </section>

                <!-- right window -->
                 <section class="content text centered flex-column" style="max-width: 150px; max-height: 235px;">
                    <img src="../images/flower-window.png">
                 </section>
            </main>
        </div> <!-- end of main container-->
    </body>
</html>
