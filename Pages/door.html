<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <link rel="stylesheet" type="text/css" href="../style.css">
        <link rel="icon" type="image/png" href="images/favicon.png">
        <title>Sarah's Catalog</title>
    </head>
    <style>
        body {
            background-color: #000000;
        }

        .content {
            border-color: #160958;
            border-radius: 0px;
        }

        .middle {
            flex-direction: row;
        }

        .site-name, .top-nav-btn {
            color: #7e0f37
        }

        .top-nav-btn:hover {
            color: #6c062c;
        } 

        .middle {
            gap: 10px;
        }
    </style> 
    <body> 
        <!-- HEADER: title and top nav bar -->
        <header>
            <h1 class="site-name">Sarah's Catalog</h1>  
            <!-- TOP NAV BUTTONS -->
            <nav class="top-nav-btns">
                <a href="../index.html" class="button top-nav-btn">Home</a>
                <a href="test.html" class="button top-nav-btn">Testing</a>
            </nav>  
        </header>

            <!-- MIDDLE: main content -->
            <main class="middle">
                <!-- left window -->
                <img src="../images/flower-window.png" style="max-height: 180px;">

                <!-- space door -->
                <!-- Image Map Generated by http://www.image-map.net/ -->
                <img src="../images/space-door.png" usemap="#space-door" style="max-width: 160px;">

                <!-- right window -->
                <img src="../images/flower-window.png" style="max-height: 180px;">
            </main> <!-- END OF MIDDLE/MAIN -->

            <map name="space-door"> <!-- removed from main/middle because of invisible whitespace -->
                    <area target="" href="lobby.html" coords="233,463,2,2" shape="rect">
            </map>
    </body>
</html>
